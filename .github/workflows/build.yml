name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      # A number quoted in the docs is a claim like any other, and it is the kind
      # that rots silently. This reads each one back out of the code it describes
      # and fails on a disagreement — including the case where the sentence holding
      # the claim has been reworded away, which would otherwise be a check that
      # passes by covering nothing.
      - name: Check the numbers the docs claim
        run: ./scripts/check-claimed-numbers.sh

      # docs/compatibility.md lists what this app assumes about Claude Code, tmux
      # and macOS — none of which is an API. A page like that maintained by hand
      # is wrong by the second release, so it is generated from the table in
      # Compat.swift and this fails when the two have drifted, or when the table
      # names a file that has since been renamed away.
      - name: Check the compatibility page matches the code
        run: ./scripts/check-compatibility-doc.sh

      # The README's Sources/ tree is what somebody reads to find their way
      # around before they know any of the names. A file missing from it is a
      # whole area of the app a newcomer never learns exists; a file renamed
      # away sends them looking for something that is not there. It listed 19
      # of 44 when this was added, not by decision but by nobody going back.
      - name: Check the README tree matches the files
        run: ./scripts/check-source-tree.sh

      - name: Build release
        run: swift build -c release

      - name: Render app icon
        run: |
          swift scripts/render-app-icon.swift build/AppIcon.iconset
          iconutil -c icns build/AppIcon.iconset -o AppIcon.icns

      - name: Create .app bundle
        run: |
          mkdir -p DynamicIsland.app/Contents/{MacOS,Resources}
          cp .build/release/DynamicIsland DynamicIsland.app/Contents/MacOS/
          cp .build/release/island-hook   DynamicIsland.app/Contents/Resources/
          chmod +x DynamicIsland.app/Contents/Resources/island-hook
          cp AppIcon.icns DynamicIsland.app/Contents/Resources/
          cp Info.plist DynamicIsland.app/Contents/
          codesign --force --deep --sign - DynamicIsland.app

      # The bundle declares its icon in Info.plist; if the resource it names is
      # missing, the release still builds and silently ships a generic icon.
      # Read the declared name back out rather than hard-coding it, so renaming
      # the icon can't quietly defeat the check.
      - name: Verify declared icon is present
        run: |
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' DynamicIsland.app/Contents/Info.plist)
          for candidate in "DynamicIsland.app/Contents/Resources/$icon" \
                           "DynamicIsland.app/Contents/Resources/$icon.icns"; do
            if [ -f "$candidate" ]; then
              echo "icon present: $candidate"
              exit 0
            fi
          done
          echo "::error::Info.plist declares CFBundleIconFile '$icon' but no matching resource exists in the bundle"
          exit 1

      - name: Zip app
        run: zip -r DynamicIsland.zip DynamicIsland.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland
          path: DynamicIsland.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DynamicIsland.zip
          generate_release_notes: true
